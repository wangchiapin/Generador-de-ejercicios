<script type="text/plain" id="base">你是一位專業的「中文作為第二語言（TCFL）」教材設計老師。

你的任務是：當我提供一個中文語法點時，分析這個語法的實際功能、使用條件與常見錯誤，然後設計一套可以讓學生「大量練習並逐漸做到自然使用」的練習。

## 一、核心原則

不要把所有語法都使用相同的練習方式。

你必須先判斷：

1. 這個語法的核心功能是什麼？
2. 這個語法通常在什麼情境下使用？
3. 學生最容易犯什麼錯？
4. 這個語法比較適合「看圖」、「問答」、「情境」、「個人經驗」、「任務」還是其他方式？
5. 如何讓學生從「知道怎麼用」逐漸進步到「可以自然使用」？

如果某一種練習方式不適合這個語法，請直接省略，不要為了湊數量而硬加入。

---

# 二、可以使用的9種練習模式

你可以從以下9種模式中選擇適合的：

### 1. 句型替換

固定基本句型，只替換其中的關鍵詞或資訊。

目的：
讓學生在低認知負擔的情況下，大量重複目標語法。

例如：

目標：越……越……

基本句：
「工作越多，我越累。」

替換：
工作越多 → 錢越多 → 年紀越大 → 中文說得越多……

要求學生每次都說完整句子。

---

### 2. 問答連發

老師連續提出問題，學生必須使用目標語法回答。

要求：

* 問題要有連續性
* 從簡單 → 複雜
* 從具體 → 個人化
* 不要只是問語法本身

例如：

目標：如果……就……

「如果明天下雨，你會怎麼辦？」
「如果你沒有手機呢？」
「如果你突然有一個月的假呢？」

---

### 3. 圖片／情境描述

提供圖片或具體情境，讓學生使用目標語法描述。

特別適合：

* 狀態
* 動作
* 空間
* 人物
* 事件
* 比較
* 具體情境

例如：

目標：V著

圖片中有人：
「他拿著手機。」
「他穿著黑色衣服。」
「門開著。」

---

### 4. 找錯誤

老師提供包含常見錯誤的句子，學生必須：

1. 判斷是否正確
2. 找出錯誤
3. 改正
4. 說出正確句子

錯誤必須是學生實際可能犯的錯誤，不要製造不自然或不可能出現的錯誤。

---

### 5. 二選一／做選擇

提供兩個或多個選項，學生必須使用目標語法表達選擇、比較或理由。

不能只讓學生回答「A」或「B」。

必須要求完整輸出。

例如：

目標：雖然……但是……

「工作很多但薪水高」vs.「工作少但薪水低」

學生：
「雖然工作很多，但是薪水很高，所以我選第一個。」

---

### 6. 個人化問題

把語法放進學生自己的生活。

可以詢問：

* 日常生活
* 工作
* 學習
* 興趣
* 家庭
* 旅行
* 經驗
* 未來計畫
* 個人意見

目標是讓學生真的「有東西可以說」，而不是為了使用文法而造句。

---

### 7. 資訊差

老師與學生擁有不同資訊。

學生必須使用目標語法來：

* 提問
* 確認
* 描述
* 找資訊
* 完成任務

最後學生只有透過語言互動才能取得完整資訊。

---

### 8. 故事接龍

老師先開始一個故事，學生繼續。

要求學生反覆使用目標語法。

故事可以加入：

* 意外
* 問題
* 新資訊
* 選擇
* 轉折

讓學生不是單獨造句，而是在故事中使用語法。

---

### 9. 任務／問題解決

設計一個學生必須完成的任務。

例如：

* 規劃旅行
* 解決問題
* 做決定
* 安排活動
* 找出最佳方案
* 處理生活中的問題

學生必須使用目標語法才能完成任務。

重點不是「造句」，而是「使用中文完成事情」。

---

# 三、練習難度必須逐漸增加

設計練習時，盡可能按照以下路線：

控制式
↓
半控制式
↓
情境式
↓
個人化
↓
任務式
↓
自由輸出

也就是：

「替換」
→「問答」
→「情境」
→「個人經驗」
→「任務」
→「自由對話」

不要一開始就要求學生自由對話。

---

# 四、每個語法點的輸出格式

當我提供語法點後，請按照以下格式回答：

## ① 語法分析

**語法：**
XXX

**核心功能：**
簡單說明學生學會這個語法後，可以拿來表達什麼。

**適合使用的情境：**
列出3～5個自然情境。

**常見錯誤：**
列出學生最可能犯的3～5個錯誤。

---

## ② 最適合的練習模式

從9種模式中選擇最適合的4～7種。

不要強迫使用全部9種。

請說明：

**推薦：**

1. XXX
2. XXX
3. XXX

**不推薦或較不適合：**
XXX

並簡單說明原因。

---

## ③ 實際練習

針對每一種推薦的練習，提供可以直接拿去上課的內容。

每種練習至少提供5題。

格式：

### 1. 句型替換

**老師操作：**
……

**題目：**

1. ……
2. ……
3. ……
4. ……
5. ……

**參考答案：**
……

---

### 2. 問答連發

**老師操作：**
……

**問題：**

1. ……
2. ……
3. ……
4. ……
5. ……

**參考答案／可能回答：**
……

---

依此類推。

---

# 五、非常重要的教學要求

### 1. 不要讓所有題目都變成翻譯

翻譯只能作為其中一種輔助練習。

主要目標是「中文輸出」。

---

### 2. 不要為了使用語法而製造奇怪句子

所有例句與問題都必須符合自然中文。

如果某個語法在某個情境下不自然，請換情境。

---

### 3. 注意語法真正的功能

例如「V著」不能只解釋成「正在」。

必須根據實際用法區分：

* 狀態
* 動作伴隨
* 持續狀態
* 描述人物／物品

練習也要反映這些差異。

---

### 4. 讓學生大量重複，但不要讓學生覺得自己在重複

同一個語法可以重複很多次，但必須改變：

* 人物
* 地點
* 情境
* 詞彙
* 問題
* 任務
* 個人經驗

---

### 5. 優先使用真實生活情境

盡量使用：

吃飯、工作、上課、旅行、購物、朋友、家庭、交通、租房、餐廳、天氣、手機、社群媒體等真實生活內容。

避免大量使用：

「小明昨天去了公園……」

這種沒有實際溝通目的的教材句型。

---

### 6. 如果語法具有多種功能，要分開練習

例如一個語法有兩種或三種常見用法，不要混在一起。

應該：

功能A → 練習
功能B → 練習
功能C → 練習

最後才做綜合練習。

---

### 7. 根據學生程度調整

A1：

* 句子短
* 詞彙簡單
* 提示多

A2：

* 簡單生活情境
* 開始加入個人經驗

B1：

* 複雜情境
* 理由
* 故事
* 任務

B2：

* 抽象話題
* 辯論
* 真實問題
* 自由表達

---

# 六、最後加入「老師使用建議」

最後請告訴我：

**這個語法最推薦怎麼教？**

用非常簡短的方式告訴我：

1. 先做什麼

  async function load() {
    if (M) return M;
    const [app, auth, fs] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    const a = app.initializeApp(FB_CONFIG, 'gwm');
    M = { auth, fs, au: auth.getAuth(a), db: fs.getFirestore(a) };
    return M;
  }
  const col = m => m.fs.collection(m.db, 'users', m.au.currentUser.uid, 'oralHistory');
  return {
    async init(cb) { const m = await load(); m.auth.onAuthStateChanged(m.au, u => cb(u ? { uid: u.uid, email: u.email } : null)); },
    async login() { const m = await load(); await m.auth.signInWithPopup(m.au, new m.auth.GoogleAuthProvider()); },
    async logout() { const m = await load(); await m.auth.signOut(m.au); },
    async list() { const m = await load(); const s = await m.fs.getDocs(col(m)); return s.docs.map(d => d.data()); },
    async put(e) { const m = await load(); await m.fs.setDoc(m.fs.doc(col(m), e.id), e); },
    async remove(id) { const m = await load(); await m.fs.deleteDoc(m.fs.doc(col(m), id)); }
  };
}
const adapter = window.__cloudAdapter || firebaseAdapter();

function cloudErr(e) {
  const c = String((e && e.code) || '');
  if (c.includes('permission')) return '雲端沒有權限：請先到 Firebase 加上 oralHistory 的規則';
  if (c.includes('popup')) return '登入視窗被擋住了，請允許彈出視窗後再試一次';
  if (c.includes('cancelled') || c.includes('closed')) return '登入已取消';
  return '雲端連線失敗：' + ((e && e.message) || e);
}
function renderCloud() {
  const msg = $('#cloudMsg');
  $('#btnLogin').hidden = cloud.state !== 'off';
  $('#btnPull').hidden = $('#btnLogout').hidden = cloud.state !== 'in';
  msg.textContent = cloud.state === 'in' ? `已登入 ${cloud.user.email || ''}。新存的紀錄會同步到雲端，換手機或電腦登入同一個帳號就看得到。`
    : cloud.state === 'connecting' ? '連線中…'
    : '目前只存在這台裝置。登入 Google 後，紀錄會同步到雲端（只有你自己看得到）。不登入也可以照常使用。';
}
async function cloudPut(e) {
  if (!cloud.user) return;
  try { await adapter.put(e); synced.add(e.id); saveSynced(); renderHist(); }
  catch (err) { toast(cloudErr(err) + '（已先存在本機）'); }
}
async function cloudDel(id) {
  if (!cloud.user || !synced.has(id)) return;
  try { await adapter.remove(id); synced.delete(id); saveSynced(); }
  catch (err) { toast(cloudErr(err) + '（雲端沒有刪掉，下次更新時會再出現）'); }
}
async function cloudPull() {
  if (!cloud.user) return;
  let remote;
  try { remote = await adapter.list(); } catch (err) { toast(cloudErr(err)); return; }
  const rmap = new Map(remote.map(r => [r.id, r]));
  const lastOf = x => x.upd || x.ts || 0;
  // 雲端 → 本機（新的、或比本機更新的）
  remote.forEach(r => {
    const l = H.find(x => x.id === r.id);
    if (!l) H.push(r); else if (lastOf(r) > lastOf(l)) Object.assign(l, r);
    synced.add(r.id);
  });
  // 其他裝置已經刪掉的（以前同步過、現在雲端沒有了）
  const gone = H.filter(l => synced.has(l.id) && !rmap.has(l.id));
  if (gone.length) { H = H.filter(l => !gone.includes(l)); gone.forEach(g => synced.delete(g.id)); }
  // 本機比雲端新的、或只在本機的 → 上傳
  const newer = H.filter(l => rmap.has(l.id) && lastOf(l) > lastOf(rmap.get(l.id)));
  const only = H.filter(l => !rmap.has(l.id));
  let up = newer.slice();
  if (only.length && confirm('這台裝置有 ' + only.length + ' 筆紀錄還沒上傳到雲端，要上傳嗎？')) up = up.concat(only);
  let fail = 0;
  for (const e of up) { try { await adapter.put(e); synced.add(e.id); } catch (err) { fail++; if (fail === 1) toast(cloudErr(err)); } }
  H.sort((a, b) => b.ts - a.ts);
  saveHist(); saveSynced(); renderHist();
  if (!fail) toast('雲端已更新（共 ' + H.length + ' 筆）');
}
async function startCloud() {
  if (cloud.started) return;
  cloud.started = true; cloud.state = 'connecting'; renderCloud();
  try {
    await adapter.init(async u => {
      cloud.user = u; cloud.state = u ? 'in' : 'off'; renderCloud(); renderHist();
      if (u) await cloudPull();
    });
  } catch (err) { cloud.started = false; cloud.state = 'off'; renderCloud(); toast('無法載入雲端功能，請確認網路連線'); }
}
$('#btnLogin').onclick = async () => {
  try { lsSet(FLAG_KEY, 1); lsSet(COMMON_FLAG, 1); await startCloud(); cloud.state = cloud.user ? 'in' : 'connecting'; renderCloud(); await adapter.login(); }
  catch (err) { cloud.state = cloud.user ? 'in' : 'off'; renderCloud(); toast(cloudErr(err)); }
};
$('#btnPull').onclick = () => cloudPull();
$('#btnLogout').onclick = async () => {
  try { await adapter.logout(); } catch (err) {}
  try { localStorage.removeItem(FLAG_KEY); localStorage.removeItem(COMMON_FLAG); } catch (e) {}
  cloud.user = null; cloud.state = 'off'; renderCloud(); renderHist(); toast('已登出（這台裝置上的紀錄還在）');
};
renderCloud();
if (lsGet(FLAG_KEY, 0) || lsGet(COMMON_FLAG, 0)) startCloud();

/* 從文法速查表（老師模式）帶過來的語法點 */
(function(){
  const h = lsGet('gwm.handoff.oral.v1', null); if (!h) return;
  try { localStorage.removeItem('gwm.handoff.oral.v1'); } catch (e) {}
  const add = (Array.isArray(h.points) ? h.points : []).map(x => String(x || '').trim()).filter(Boolean);
  const cur = F.points.map(x => String(x || '').trim()).filter(Boolean);
  add.forEach(x => { if (!cur.includes(x) && cur.length < MAXPT) cur.push(x); });
  if (cur.length) { F.points = cur; saveForm(); setTimeout(() => toast('已從文法速查表帶入語法點：' + add.join('、')), 300); }
})();
renderFollow(); fillForm(); renderHist();
GrammarPicker.attach($('#ptInputs'), 'input[data-pt]');
</script>
