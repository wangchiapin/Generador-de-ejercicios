<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="語法練習單產生器 · Generador de ejercicios">
<meta property="og:description" content="挑語法點，一鍵產生練習單｜Elige un punto gramatical y crea tu hoja">
<meta property="og:url" content="https://wangchiapin.github.io/Generador-de-ejercicios/">
<meta property="og:image" content="https://wangchiapin.github.io/Generador-de-ejercicios/og.jpg?v=20261029">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>語法練習單產生器</title>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/full.js"></script>
<style>
:root{
  --bg:#e6e3dc; --paper:#d9d5cc; --ink:#161616; --sub:#46423c; --line:#a9a398; --line2:#c4bfb4;
  --accent:#5f5a53; --warn:#8a5a3c; --warnbg:#f6f1ea;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  letter-spacing:.02em;line-height:1.7;-webkit-font-smoothing:antialiased}
header.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  max-width:900px;margin:0 auto;padding:36px 24px 14px}
header.bar h1{margin:0;font-size:1.35rem;font-weight:500;letter-spacing:.08em}
header.bar .sub{color:var(--sub);font-size:.8rem;margin-top:2px}
.proj{display:flex;gap:8px;flex-wrap:wrap}
nav.steps{max-width:900px;margin:0 auto;padding:0 24px;display:flex;gap:28px;border-bottom:1px solid var(--line)}
nav.steps button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;margin-bottom:-1px;
  font:inherit;color:var(--sub);cursor:pointer;letter-spacing:.06em}
nav.steps button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
main{max-width:900px;margin:0 auto;padding:8px 24px 80px}
section.step{display:none}
section.step.on{display:block}
h2{font-size:1.05rem;font-weight:500;letter-spacing:.06em;margin:32px 0 6px}
p.hint{color:var(--sub);font-size:.86rem;margin:2px 0 14px}
hr{border:0;border-top:1px solid var(--line);margin:34px 0 6px}
button,.filebtn{font:inherit;font-size:.88rem;letter-spacing:.05em;color:var(--ink);background:transparent;
  border:1px solid var(--ink);border-radius:0;padding:5px 14px;cursor:pointer;display:inline-block}
button:hover,.filebtn:hover{background:#cfcbc1}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:#4a4a4a}
button.quiet{border-color:var(--line);color:var(--accent)}
button.tiny{padding:1px 9px;font-size:.78rem;border-color:var(--line);color:var(--accent)}
button.link{border:0;padding:0;text-decoration:underline;color:var(--accent);font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
input[type=text],input:not([type]),input[type=number],select,textarea{
  font:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1px solid #8a857b;border-radius:0;
  padding:8px 11px;width:100%;letter-spacing:.02em}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:#333;width:auto}
.fld{margin:8px 0}
.fld>label{display:block;font-size:.84rem;color:var(--sub);margin-bottom:3px;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.counts{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0}
.counts .fld input{text-align:center}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.counts{grid-template-columns:repeat(3,1fr)}}
.msg{margin:10px 0;font-size:.88rem}
.msg .ok{color:var(--accent)}
.msg .bad{color:var(--warn);background:var(--warnbg);padding:10px 12px;border-left:2px solid var(--warn);white-space:pre-wrap}
details{margin:6px 0}
summary{cursor:pointer;color:var(--accent);font-size:.86rem}
.summary{position:sticky;top:0;z-index:6;background:#fff;border:1px solid var(--line);padding:10px 16px;margin:12px 0;display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.summary .n{color:var(--sub)}
.sec{margin:34px 0 0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.sechead .t{font-size:1.15rem;letter-spacing:.06em}
.sechead .t small{color:var(--sub);font-size:.78rem;margin-left:8px}
.sechead .count{color:var(--sub);font-size:.8rem}
.chk{display:inline-flex;gap:8px;align-items:baseline;cursor:pointer}
.card{border:1px solid var(--line);padding:0 18px 12px;margin:16px 0;background:#fff}
.card.off{opacity:.45}
.card .ch{display:flex;justify-content:space-between;align-items:center;margin:0 -18px 10px;padding:6px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-size:.92rem;color:var(--ink)}
.card .chbtns{display:flex;gap:6px}
.derived{margin-top:12px;padding-top:8px;border-top:1px dashed #8a857b;font-size:.9rem;color:var(--sub);line-height:1.6}
.derived div{margin:1px 0}
.derived b{font-weight:400;color:var(--accent);margin-right:6px}
.derived details.more{margin:2px 0 0}
.derived details.more summary{font-size:.86rem;color:var(--sub)}
.noterow{margin:4px 0 0}
.ptags{margin:0 0 8px;font-size:.88rem}
.ptags summary{font-size:.88rem;color:var(--sub);list-style:none;cursor:pointer}
.ptags summary::-webkit-details-marker{display:none}
.ptags .badge{display:inline-block;border:1px solid #b5b0a7;padding:0 9px;margin-right:6px;color:var(--ink);background:#faf9f7}
.ptags .mixb{background:var(--ink);border-color:var(--ink);color:#fff}
.ptags .edit{text-decoration:underline;margin-left:4px}
.ptags .picks{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 2px;padding:8px 10px;background:var(--paper)}
.ptags .picks label{cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.ptinputs{display:grid;gap:8px}
.errbox .fld{margin-top:8px}
#mixFld{margin-bottom:14px}
.issues{margin-top:6px;font-size:.8rem;color:var(--warn)}
.issues div{margin:2px 0}
.swapbox{margin-top:10px;padding:10px;background:var(--paper);font-size:.84rem}
.swapbox[hidden]{display:none}
.optrow{display:flex;gap:10px;align-items:center;margin:4px 0}
.optrow label{white-space:nowrap;font-size:.84rem;color:var(--accent)}
.clozeAns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.clozeAns .fld{margin:0;width:110px}
.gbrow{display:grid;grid-template-columns:1.2fr 1.2fr 1.2fr auto;gap:8px;margin:5px 0;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:12px 0}
.opts label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.opts select{width:auto}
.previewWrap{margin:22px 0 0;border:1px solid var(--line);background:var(--paper);padding:20px}
.previewNote{color:var(--sub);font-size:.78rem;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;
  font-size:.86rem;letter-spacing:.05em;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:.95}

/* ---------- worksheet (shared by preview and print) ---------- */
.sheet{background:#fff;color:#222;font-size:10.5pt;line-height:1.5;padding:12mm 12mm 10mm;max-width:210mm;margin:0 auto;
  box-shadow:0 0 0 1px var(--line)}
.sheet h1{margin:0;font-size:22pt;font-weight:500;letter-spacing:.06em;line-height:1.2}
.s-top{border-bottom:.75pt solid #222;padding-bottom:3mm}
.s-sub{color:#777;font-size:9.5pt;margin-top:1mm}
.s-who{display:flex;gap:8mm;margin:4mm 0 3mm;font-size:9.5pt;color:#555}
.s-who span{flex:1;border-bottom:.5pt solid #999;padding-bottom:.5mm}
.s-box{border:.6pt solid #aaa;padding:3mm 4mm;margin:2mm 0 4mm;break-inside:avoid}
.s-box h3{margin:0 0 1.5mm;font-size:10pt;font-weight:500;letter-spacing:.06em}
.s-box table{width:100%;border-collapse:collapse;font-size:9.6pt}
.s-box td{padding:1mm 1.5mm;border-bottom:.4pt solid #ddd;vertical-align:top}
.s-box tr:last-child td{border-bottom:0}
.s-box td.p{white-space:nowrap;font-weight:500}
.s-box td.x{font-size:11pt;white-space:nowrap}
.s-warn{margin-top:1.5mm;font-size:9.2pt;color:#444}
.s-sec{margin-top:5mm;break-inside:avoid}
.s-sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.5pt solid #999;margin-bottom:2.5mm;padding-bottom:.8mm;break-after:avoid}
.s-sh .t{font-size:12.5pt;font-weight:500;letter-spacing:.05em}
.s-sh .t small{font-size:8.8pt;font-weight:400;color:#777;margin-left:2mm;letter-spacing:.02em}
.s-sh .p{font-size:8.8pt;color:#777;white-space:nowrap}
.s-bank{display:inline-block;border:.6pt solid #999;padding:1mm 4mm;margin-bottom:2.5mm;font-size:12pt;word-spacing:2mm}
.s-bank small{color:#777;font-size:8.5pt;margin-left:2mm;word-spacing:0}
.s-item{margin:0 0 2.6mm;break-inside:avoid}
.s-no{display:inline-block;min-width:6mm;color:#777;font-size:9.5pt;margin-right:1.5mm}
.s-zh{font-size:14pt}
.s-es{color:#777;font-size:8.8pt;margin:.4mm 0 0 7.5mm}
.s-blank{display:inline-block;width:17mm;border-bottom:.75pt solid #222;height:1em;vertical-align:-1pt;margin:0 1mm}
.s-pblank{display:inline-block;min-width:19mm;border-bottom:.75pt solid #222;text-align:center;margin:0 1mm;font-size:11pt;color:#555;height:1.2em;vertical-align:-1pt}
.s-para{font-size:12.5pt;line-height:2;border:.5pt solid #bbb;padding:2.5mm 4mm}
.s-tok{display:inline-block;border:.6pt solid #888;border-radius:1mm;padding:.6mm 3mm;margin:0 2mm 1mm 0;font-size:13pt}
.s-line{border-bottom:.5pt solid #999;height:8mm;margin:0 0 0 7.5mm}
.s-opts{margin:1mm 0 0 7.5mm}
.s-opt{display:inline-block;margin:0 5mm 0 0;font-size:12pt;white-space:nowrap}
.s-opt b{font-weight:500;margin-right:1.5mm;color:#555}
.s-resp{float:right;color:#777;font-size:8.8pt;margin:0 4mm 0 0}
.s-vocab{color:#555;font-size:8.8pt;margin:.4mm 0 1mm 7.5mm}
.s-key{margin:0 0 2.2mm;padding-bottom:2mm;border-bottom:.25mm solid #ddd;break-inside:avoid}
.s-key .s-zh{font-size:13pt}
.s-ans{display:inline-block;min-width:8mm;text-align:center;font-weight:600;border-bottom:.75pt solid #222;margin:0 1mm;padding:0 1mm}
.s-d{color:#777;font-size:8.8pt;margin:0 0 0 7.5mm}
.s-note{color:#444;font-size:8.8pt;margin:.3mm 0 0 7.5mm}
.s-tag{display:inline-block;font-size:7.8pt;color:#777;border:.2mm solid #bbb;padding:0 1.4mm;margin-left:2mm;letter-spacing:.04em;vertical-align:.3mm}
.s-stat{margin-top:4mm;font-size:9pt;color:#555}
.s-wrong{color:#999;text-decoration:line-through}
.s-kh{font-size:11pt;font-weight:500;margin:3.5mm 0 1.5mm;border-bottom:.4pt solid #ccc;break-after:avoid}
.s-teacher{border-left:1.5pt solid #555;padding:2mm 4mm;font-size:9pt;margin-top:4mm;color:#444;break-inside:avoid}
.s-answer{break-before:page;page-break-before:always}
.s-answer.pg{margin-top:16mm;padding-top:10mm;border-top:3px double #bbb;position:relative}
.s-answer.pg::before{content:'↓ 答案頁（列印時會自動另起一頁）';position:absolute;top:-4.2mm;left:50%;transform:translateX(-50%);background:#fff;padding:0 4mm;font-size:8.5pt;color:#999;letter-spacing:.08em;white-space:nowrap}
.sheet ruby{ruby-position:over}
.sheet rt{font-size:.42em;color:#555;font-weight:400;letter-spacing:0}
.sheet .s-zh ruby, .sheet .s-para ruby{ruby-align:center}

@media(max-width:640px){.sitebar{padding:12px 16px 0}.sitetabs{gap:16px}}
@media print{
  body{background:#fff}
  body.print-sheet header.bar,body.print-sheet nav.steps,body.print-sheet .noprint,
  body.print-sheet section.step{display:none!important}
  body.print-sheet section#step3{display:block!important}
  body.print-sheet main{padding:0;max-width:none}
  body.print-sheet .previewWrap{border:0;background:#fff;padding:0;margin:0}
  body.print-sheet .sheet{box-shadow:none;padding:0;max-width:none}
  .s-answer.pg{margin-top:0;padding-top:0;border-top:0}
  .s-answer.pg::before{display:none}
  body.print-sheet #toast{display:none}
}
.sitebar{max-width:900px;margin:0 auto;padding:14px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sitetabs{display:flex;gap:22px;flex-wrap:wrap}
.sitetabs a{color:var(--sub);text-decoration:none;font-size:.9rem;letter-spacing:.06em;padding:4px 0;border-bottom:3px solid transparent}
.sitetabs a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.siteauth{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--sub)}
details.menu{position:relative}
details.menu>summary{list-style:none;display:inline-block;border:1px solid var(--line);color:var(--accent);padding:5px 14px;font-size:.88rem;letter-spacing:.05em;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.menuitems{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);min-width:170px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.menuitems .mi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);padding:9px 14px;background:#fff;color:var(--ink);font-size:.9rem;cursor:pointer}
.menuitems .mi:last-child{border-bottom:0}
.menuitems .mi:hover{background:#cfcbc1}
h2 .no{display:inline-block;min-width:1.6em;color:var(--sub);font-weight:400}
details.errdet,details.metadet{margin:10px 0}
.optgrp h3{font-size:.84rem;font-weight:400;color:var(--sub);margin:16px 0 2px;letter-spacing:.06em}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pjpanel{border:1px solid var(--line);background:var(--paper);padding:6px 18px 16px;margin:18px 0 6px}
.pjpanel h2{margin-top:14px}
.pjbox{border:1px solid var(--line);background:#fff;padding:10px 14px;margin:10px 0}
.pjitem{border:1px solid var(--line);background:#fff;margin:8px 0;padding:8px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pjitem b{font-weight:500}
.pjitem small{color:var(--sub);margin-left:8px}
.pjtag{display:inline-block;border:1px solid var(--line);color:var(--sub);font-size:.72rem;padding:0 6px;margin-left:8px}
.pjmeter{color:var(--sub);font-size:.8rem}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="sitebar noprint">
  <nav class="sitetabs"><a href="index.html" class="on">練習單</a><a href="oral-practice.html">口說練習</a><a href="dialogue-prompt.html">對話教材</a></nav>
  <div class="siteauth"><span id="siteUser"></span><button class="quiet" id="pjLogin">登入同步</button><button class="tiny" id="pjLogout" hidden>登出</button></div>
</div>
<header class="bar noprint">
  <div>
    <h1>語法練習單產生器</h1>
    <div class="sub">給西語學生的華語語法練習單：出題、檢查、輸出</div>
  </div>
  <div class="proj">
    <details class="menu" id="projMenu"><summary>專案 ▾</summary>
      <div class="menuitems">
        <button class="mi" id="btnProjList">我的練習單</button>
        <button class="mi" id="btnNew">新專案</button>
        <button class="mi" id="btnSaveProj">儲存成檔案</button>
        <label class="mi filebtn" style="border:0;border-bottom:0;cursor:pointer">開啟檔案<input type="file" id="fileOpen" accept=".json,application/json" hidden></label>
      </div>
    </details>
  </div>
</header>
<nav class="steps noprint">
  <button data-step="1" class="on">1　出題</button>
  <button data-step="2">2　檢查</button>
  <button data-step="3">3　輸出</button>
</nav>
<main>
  <section id="projPanel" class="pjpanel noprint" hidden>
    <h2>我的練習單</h2>
    <p class="hint">把目前這份存進清單，之後可以隨時打開。預設存在這台裝置的瀏覽器裡；登入 Google 後會同步到雲端，換手機或電腦也看得到。</p>
    <div class="pjbox">
      <div class="hint" id="pjCloudMsg" style="margin:0 0 8px"></div>
      <div class="row" style="margin:0">
        <button class="quiet" id="pjPull" hidden>從雲端更新</button>
      </div>
    </div>
    <div class="row"><input id="pjName" placeholder="這份的名稱（不填就用語法點）" style="max-width:420px"><button class="primary" id="pjSave">存入清單</button></div>
    <input id="pjFilter" placeholder="搜尋清單" style="max-width:420px">
    <div id="pjList"></div>
    <div class="pjmeter" id="pjMeter"></div>
  </section>
  <!-- ============ 1 出題 ============ -->
  <section id="step1" class="step on noprint">
    <h2><span class="no">①</span>設定，複製出題指令</h2>
    <p class="hint">填好語法點，複製指令，貼給任何 AI（Claude、ChatGPT、Gemini 都可以）。AI 回覆之後，把整段貼回下面。</p>
    <div class="grid2">
      <div class="fld"><label>語法點（填 1 個是單一語法點；填 2～3 個就會出「綜合練習」，題目會混合使用）</label>
        <div class="ptinputs" id="ptInputs"></div></div>
      <div class="fld"><label>程度</label>
        <select id="fLevel"><option>入門</option><option selected>初級</option><option>初中級</option><option>中級</option><option>中高級</option></select></div>
    </div>
    <div class="fld" id="mixFld" hidden><label>混合題比例（每題型中，同一句要同時用到 2 個以上語法點的題目至少佔多少）</label>
      <select id="fMix"><option value="30">至少 30%</option><option value="50">至少 50%（建議）</option><option value="70">至少 70%</option><option value="100">全部都要混合</option></select></div>
    <div class="fld"><label>段落填空的主題</label><input id="fTheme" placeholder="例如：生活情境（點餐、問路、介紹家人）"></div>
    <div class="fld"><label>各題型要幾題（填 0 就不出這一種；段落填空的數字是空格數）</label></div>
    <div class="counts" id="counts"></div>
    <details class="errdet"><summary>西語學生常錯的地方（選填）</summary><div class="errbox" id="errBox"></div></details>
    <div class="row">
      <button class="primary" id="btnCopyPrompt">複製出題指令</button>
      <span class="hint" style="margin:0 0 0 6px">範例：</span>
      <button class="link" id="btnExample">單一（比較句）</button>
      <button class="link" id="btnExample2">綜合（比較句＋得字補語）</button>
    </div>
    <details><summary>看指令內容</summary><textarea id="promptView" readonly rows="14"></textarea></details>

    <hr>
    <h2><span class="no">②</span>貼回 AI 的回覆</h2>
    <p class="hint">整段貼上就好，前後有說明文字也沒關係。格式不對時，我會告訴你哪裡有問題。</p>
    <textarea id="pasteBox" rows="9" placeholder="把 AI 回傳的內容貼在這裡"></textarea>
    <div class="row"><button class="primary" id="btnImport">讀入並檢查</button><button class="quiet" id="btnClearPaste">清空</button></div>
    <div class="msg" id="importMsg"></div>
  </section>

  <!-- ============ 2 檢查 ============ -->
  <section id="step2" class="step noprint"></section>

  <!-- ============ 3 輸出 ============ -->
  <section id="step3" class="step">
    <div class="noprint" id="outControls"></div>
    <div class="previewWrap"><div id="sheet" class="sheet"></div></div>
    <p class="previewNote noprint">預覽只是大概的樣子，實際分頁以列印出來的結果為準。</p>
  </section>

function tagName(p) { return String(p || '').split(/[（(]/)[0].trim(); }

function tagList(v) {
  const a = Array.isArray(v) ? v : (v == null || v === '' ? [] : String(v).split(/[\s＋+、,，/／]+/));

  return t;
}

  for (const sec of state.sections) {
    if (!sec.enabled || sec.type === 'cloze') continue;
    for (const it of sec.items) {
      if (!it.enabled) continue;

function normItem(type, it) {
  const b = blankItem(type);
  b.note = str(it.note);
  b.points = tagList(it.points || it.tags || it.point);
  switch (type) {
    case 'fill': b.zh = str(it.zh || it.sentence || it.text); b.answer = str(it.answer); b.es = str(it.es); break;
    case 'cloze': {
      b.text = str(it.text); b.es = str(it.es);

      if (a && !Array.isArray(a) && typeof a === 'object') a = Object.keys(a).sort((x, y) => x - y).map(k => a[k]);
      b.answers = (Array.isArray(a) ? a : []).map(str); break;
    }

/* AI 回傳的 JSON → 區段。回傳 { sections, title, subtitle, grammarBox, notes[] } */
function fromAI(j) {
  const notes = [];
  const res = { sections: [], title: str(j.title), subtitle: str(j.subtitle), grammarBox: null, notes };
  const gb = j.grammar_box || j.grammarBox;
  if (gb && Array.isArray(gb.points)) {
    res.grammarBox = { points: gb.points.map(p => ({ pattern: str(p.pattern), es: str(p.es), example: str(p.example) })), warning: str(gb.warning) };
  }
  for (const type of TYPES) {
    const blk = j[type];
    if (!blk) continue;
    const sec = blankSection(type);
    sec.bank = splitList(blk.bank);
    if (type === 'cloze') {
      const items = Array.isArray(blk.items) ? blk.items : [blk];
      sec.items = items.map(it => normItem('cloze', it));
      if (isMulti()) sec.items.forEach(it => { if (!it.points.length) it.points = tagNames(); });
    } else {
      const items = Array.isArray(blk.items) ? blk.items : (Array.isArray(blk) ? blk : []);
      sec.items = items.map(it => normItem(type, it));
    }
    if (type === 'order') {
      let n = 0;
      sec.items.forEach(it => {
        const ans = it.answer.replace(/[。！？，、.!?,\s]/g, '');
        if (it.tokens.length && it.tokens.join('') === ans) { it.tokens = shuffleTokens(it.tokens, it.answer); n++; }
      });
      if (n) notes.push(`排序有 ${n} 題的詞塊本來就是正確順序，我已經幫你重新打散。`);
    }
    if (sec.items.length) res.sections.push(sec);
  }
  return res;
}

/* 容錯的 JSON 讀取 */
function tolerantParse(text) {
  let s = String(text || '').replace(/^﻿/, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < 0 || b <= a) throw new Error('找不到 JSON。回覆裡要有以「{」開頭、以「}」結尾的一整段。');
  s = s.slice(a, b + 1);
  try { return JSON.parse(s); } catch (e1) {
    const fixed = s.replace(/,\s*([}\]])/g, '$1');
    try { return JSON.parse(fixed); } catch (e2) {
      const m = /position (\d+)/.exec(e2.message || '');
      let where = '';
      if (m) { const p = +m[1]; where = `\n大約在這附近：「${fixed.slice(Math.max(0, p - 20), p + 20).replace(/\s+/g, ' ')}」`; }
      throw new Error('JSON 格式有問題，電腦讀不懂。' + where + '\n常見原因：句子裡有沒跳脫的雙引號、少了逗號或括號。可以把這段貼回給 AI，請它「只修正 JSON 格式，內容不要改」。');
    }
  }
}

function itemSummary(type, it) {
  switch (type) {
    case 'fill': return `${it.zh}（答案：${it.answer}）`;
    case 'cloze': return it.text.slice(0, 40) + '…';
    case 'order': return it.answer;
    case 'choice': return `${it.es}（正確：${it.options[it.answer] || ''}）`;
    case 'fix': return `${it.wrong} → ${it.correct}`;
    case 'translate': return `${it.es} → ${it.answer}`;
  }
}

const MAINLAND = { '公交車': '公車', '地鐵': '捷運', '出租車': '計程車', '視頻': '影片', '信息': '訊息', '軟件': '軟體', '硬件': '硬體',
  '網絡': '網路', '酸奶': '優格', '土豆': '馬鈴薯', '打印': '列印', '質量': '品質', '鼠標': '滑鼠', '雪糕': '冰淇淋', '自行車': '腳踏車',
  '摩托車': '機車', '塑料': '塑膠', '早點': '早餐', '洗衣機': '洗衣機', '菠蘿': '鳳梨', '西紅柿': '番茄', '方便麵': '泡麵', '打的': '搭計程車', '外賣': '外送' };
function fieldTexts(type, it) {
  switch (type) {
    case 'fill': return [it.zh, it.answer];
    case 'cloze': return [it.text, ...it.answers];
    case 'order': return [...it.tokens, it.answer];
    case 'choice': return it.options;
    case 'fix': return [it.wrong, it.correct, it.tip];
    case 'translate': return [it.vocab, it.answer];
  }
  return [];
}
function validate() {
  const out = {};   // itemId -> [msg]
  const gen = [];   // 全域提醒
  const add = (id, m) => { (out[id] = out[id] || []).push(m); };
  for (const sec of state.sections) {
    if (!sec.enabled) continue;
    const bank = sec.bank;
    if ((sec.type === 'fill' || sec.type === 'cloze') && !bank.length) gen.push(`「${DEF[sec.type].name}」沒有詞庫。`);
    if (new Set(bank).size !== bank.length) gen.push(`「${DEF[sec.type].name}」的詞庫有重複的詞。`);
    const letters = [];
    for (const it of sec.items) {
      if (!it.enabled) continue;
      switch (sec.type) {
        case 'fill': {
          const n = (it.zh.match(/__/g) || []).length;
          if (n !== 1) add(it.id, `題目要剛好有一個空格（__），現在有 ${n} 個。`);
          if (!it.answer) add(it.id, '還沒有答案。');
          else if (bank.length && !bank.includes(it.answer)) add(it.id, `答案「${it.answer}」不在詞庫裡。`);
          if (!it.es) add(it.id, '沒有西文提示，答案可能不只一個。');
          break;
        }
        case 'cloze': {
          const mk = markers(it.text); const uniq = Array.from(new Set(mk));
          if (!uniq.length) add(it.id, '短文裡沒有空格（要用 {1} {2} … 標出）。');
          const max = uniq.length ? Math.max(...uniq) : 0;
          if (max !== uniq.length) add(it.id, '空格編號要從 {1} 開始連續，中間不能跳號。');
          if (it.answers.length !== uniq.length) add(it.id, `有 ${uniq.length} 個空格，但答案有 ${it.answers.length} 個。`);
          it.answers.forEach((a, i) => { if (!a) add(it.id, `第 ${i + 1} 格還沒有答案。`); else if (bank.length && !bank.includes(a)) add(it.id, `第 ${i + 1} 格的答案「${a}」不在詞庫裡。`); });
          if (bank.length && bank.length < it.answers.length) add(it.id, '詞庫的詞比空格還少。');
          if (new Set(it.answers).size !== it.answers.length && new Set(bank).size === bank.length) add(it.id, '有答案重複用到同一個詞；如果每個詞只能用一次，請改答案或詞庫。');
          if (!it.es) add(it.id, '沒有整段的西文翻譯。');
          break;
        }
        case 'order': {
          const strip = s => Array.from(s.replace(/[。！？，、.!?,\s]/g, '')).sort().join('');
          if (it.tokens.length < 3) add(it.id, '詞塊太少（至少 3 塊）。');
          if (!it.answer) add(it.id, '還沒有正確句子。');
          else if (strip(it.tokens.join('')) !== strip(it.answer)) add(it.id, '詞塊合起來的字，和正確句子不一樣（多字、少字或寫錯）。');
          else if (it.tokens.join('') === it.answer.replace(/[。！？，、.!?,\s]/g, '')) add(it.id, '詞塊的順序剛好就是答案，沒有打散。');
          if (!it.es) add(it.id, '沒有西文提示，排法可能不只一種。');
          break;
        }
        case 'choice': {
          const opts = it.options.filter(Boolean);
          if (opts.length < 2) add(it.id, '選項至少要 2 個。');
          if (new Set(opts).size !== opts.length) add(it.id, '有重複的選項。');
          if (!it.options[it.answer]) add(it.id, '正確答案那一格是空的。');
          if (!it.es) add(it.id, '沒有西文意思。');
          letters.push(it.answer);
          break;
        }
        case 'fix': {
          if (!it.wrong || !it.correct) add(it.id, '錯誤句子和正確句子都要填。');
          else if (it.wrong === it.correct) add(it.id, '錯誤句子和正確句子一樣。');
          if (!it.tip) add(it.id, '沒有說明錯在哪裡。');
          break;
        }
        case 'translate': {
          if (!it.es) add(it.id, '還沒有西班牙文。');
          if (!it.answer) add(it.id, '還沒有標準答案。');
          break;
        }
      }
      // 簡體字、大陸用語
      const texts = fieldTexts(sec.type, it).join('');
      const simp = suspectSimplified(texts);
      if (simp.length) add(it.id, `可能混到簡體字：${simp.join(' ')}`);
      for (const w of Object.keys(MAINLAND)) if (texts.includes(w)) add(it.id, `「${w}」是大陸用語，台灣常說「${MAINLAND[w]}」。`);
    }
    if (isMulti()) {
      const names = tagNames();
      for (const it of sec.items) {
        if (!it.enabled) continue;
        if (!it.points.length) add(it.id, '沒有標記語法點。');
        else { const bad = it.points.filter(t => !names.includes(t)); if (bad.length) add(it.id, `語法點標記「${bad.join('、')}」不在你填的語法點裡。`); }
      }
    }
    if (sec.type === 'choice' && letters.length >= 4 && new Set(letters).size === 1) gen.push('「選擇」的正確答案全部都在同一個選項，建議分散。');
  }
  if (isMulti()) {
    const st = pointStats();
    st.names.forEach(n => { if (st.total && st.per[n] / st.total < 0.3) gen.push(`語法點「${n}」只出現在 ${st.per[n]} / ${st.total} 題，比例偏低（建議至少 30%）。`); });
    const need = mixNeed(st.total);
    if (st.total && st.mixed < need) gen.push(`混合題只有 ${st.mixed} 題（共 ${st.total} 題，目標至少 ${need} 題）。可以請 AI 補幾題混合的，或把比例調低。`);
    // 每個題型各自檢查
    for (const sec of state.sections) {
      if (!sec.enabled || sec.type === 'cloze') continue;
      const its = sec.items.filter(i => i.enabled); if (its.length < 2) continue;
      if (!its.some(isMixed)) gen.push(`「${DEF[sec.type].name}」沒有任何混合題。`);
    }
  }
  return { items: out, general: gen };
}

let step = 1;
function goStep(n) {
  step = n;
  $$('nav.steps button').forEach(b => b.classList.toggle('on', +b.dataset.step === n));
  $$('section.step').forEach(s => s.classList.toggle('on', s.id === 'step' + n));

  if (n === 3) renderOut();
  window.scrollTo({ top: 0 });
}
$$('nav.steps button').forEach(b => b.addEventListener('click', () => goStep(+b.dataset.step)));

   第 2 步：檢查

const inp = (f, v, ph = '') => `<input data-f="${f}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const ta = (f, v, rows = 2, ph = '') => `<textarea data-f="${f}" rows="${rows}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const fld = (label, html, cls = '') => `<div class="fld ${cls}"><label>${label}</label>${html}</div>`;

function clozeAnswersHTML(it) {
  const n = Array.from(new Set(markers(it.text))).length;
  let h = '';
  for (let i = 0; i < n; i++) h += `<div class="fld"><label>${CIRC[i] || (i + 1)} 答案</label><input data-f="ans" data-i="${i}" value="${esc(it.answers[i] || '')}"></div>`;
  return h || '<span style="color:var(--sub);font-size:.8rem">短文裡還沒有空格，請用 {1} {2} … 標出。</span>';
}
function cardBody(type, it) {
  switch (type) {
    case 'fill': return fld('題目（空格用 __ 兩個底線）', inp('zh', it.zh)) + `<div class="grid2">${fld('答案', inp('answer', it.answer))}${fld('西文提示（讓答案唯一）', inp('es', it.es))}</div>`;
    case 'cloze': return fld('短文（空格用 {1} {2} … 標出）', ta('text', it.text, 5)) + `<div class="clozeAns">${clozeAnswersHTML(it)}</div>` + fld('整段西文翻譯', ta('es', it.es, 3));
    case 'order': return fld('詞塊（用 / 分開，順序是打散後的）', inp('tokens', it.tokens.join(' / '))) + fld('正確句子', inp('answer', it.answer)) +
      `<div class="row" style="margin:4px 0"><button class="tiny" data-act="segment">由正確句子自動切詞並打散</button><button class="tiny" data-act="shuffle">重新打散</button></div>` + fld('西文提示', inp('es', it.es));
    case 'choice': return fld('西文意思', inp('es', it.es)) + it.options.map((o, i) =>
      `<div class="optrow"><label><input type="radio" name="ans-${it.id}" data-f="answer" value="${i}" ${it.answer === i ? 'checked' : ''}> ${LETTER[i]}　正確</label>${inp('opt' + i, o)}</div>`).join('');
    case 'fix': return fld('錯誤句子', inp('wrong', it.wrong)) + fld('正確句子', inp('correct', it.correct)) + fld('說明（白話）', inp('tip', it.tip));
    case 'translate': return fld('西班牙文', inp('es', it.es)) + `<div class="grid2">${fld('提示詞', inp('vocab', it.vocab))}${fld('標準答案', inp('answer', it.answer))}</div>`;
  }
}
function answerSentence(type, it) {
  switch (type) {
    case 'fill': return it.zh.replace('__', it.answer);
    case 'cloze': return it.text.replace(/\{(\d+)\}/g, (m, n) => it.answers[n - 1] || '');
    case 'order': return it.answer;
    case 'choice': return it.options[it.answer] || '';
    case 'fix': return it.correct;
    case 'translate': return it.answer;
  }
  return '';
}
function derivedHTML(type, it) {
  const s = answerSentence(type, it);

  if (typeof pinyinPro === 'undefined') return '<div>（拼音、簡體需要網路載入函式庫）</div>';
  let h = `<div><b>拼音</b>${esc(pyLine(s))}　<button class="link" data-act="fixReading">讀音不對？</button></div>`;
  h += `<details class="more"><summary>簡體、注音</summary>`;
  if (typeof OpenCC !== 'undefined') h += `<div><b>簡體</b>${esc(toSimp(s))}</div>`;
  h += `<div><b>注音</b>${esc(zyLine(s))}</div></details>`;
  return h;
}
function tagsHTML(it, open) {

    <div id="gbBox">${gbHTML()}</div>

/* ---- 練習單 HTML ---- */
function partsOf(type, it) {
  if (type === 'fill') {
    const i = it.zh.indexOf('__');
    if (i < 0) return [{ t: 'txt', s: it.zh }];
    return [{ t: 'txt', s: it.zh.slice(0, i) }, { t: 'blank', a: it.answer, n: 0 }, { t: 'txt', s: it.zh.slice(i + 2) }];
  }
  const parts = []; let last = 0; const re = /\{(\d+)\}/g; let m;
  while ((m = re.exec(it.text))) {
    if (m.index > last) parts.push({ t: 'txt', s: it.text.slice(last, m.index) });
    parts.push({ t: 'blank', a: it.answers[m[1] - 1] || '', n: +m[1] }); last = m.index + m[0].length;
  }
  if (last < it.text.length) parts.push({ t: 'txt', s: it.text.slice(last) });
  return parts;
}
function renderParts(parts, mode, blankFn) {
  const filled = parts.map(p => p.t === 'txt' ? p.s : p.a).join('');
  const syl = mode === 'none' ? null : syllables(filled);
  let pos = 0, out = '';
  for (const p of parts) {
    if (p.t === 'blank') { out += blankFn(p); pos += p.a.length; continue; }
    for (const ch of p.s) {
      const x = syl && syl[pos];
      if (x && x.isZh && (mode === 'pinyin' ? x.py : x.zy)) out += `<ruby>${esc(ch)}<rt>${esc(mode === 'pinyin' ? x.py : x.zy)}</rt></ruby>`;
      else out += esc(ch);
      pos += ch.length;
    }
  }
  return out;
}
const plain = (s, mode) => renderParts([{ t: 'txt', s }], mode, () => '');

  const o = state.opts; let h = '';
  if (o.simp) h += `<div class="s-d">${esc(toSimp(s))}</div>`;

  if (o.zhuyin) h += `<div class="s-d">${esc(zyLine(s))}</div>`;

}
function levelEs() { return LEVEL_ES[state.meta.level] || ''; }

      case 'order': h += `<div class="s-key">${n}<span class="s-zh">${esc(it.answer)}</span>${tagHTML(it)}${derivedLines(it.answer)}${es(it.es)}${note(it)}</div>`; break;
      case 'choice': h += `<div class="s-key">${n}<span class="s-zh"><span class="s-ans">${LETTER[it.answer] || '?'}</span>${esc(it.options[it.answer] || '')}</span>${tagHTML(it)}${derivedLines(it.options[it.answer] || '')}${es(it.es)}${note(it)}</div>`; break;
      case 'fix': h += `<div class="s-key">${n}<span class="s-zh"><span class="s-wrong">${esc(it.wrong)}</span> → <span class="s-ans">${esc(it.correct)}</span></span>${tagHTML(it)}${derivedLines(it.correct)}${it.tip ? `<div class="s-note">${esc(it.tip)}</div>` : ''}${note(it)}</div>`; break;
      case 'translate': h += `<div class="s-key">${n}<span class="s-zh">${esc(it.answer)}</span>${tagHTML(it)}${derivedLines(it.answer)}${es(it.es)}${note(it)}</div>`; break;
    }
  });
  return h;
}
function buildSheetHTML() {
  const o = state.opts, m = state.meta;
  const secs = state.sections.filter(s => s.enabled && s.items.some(i => i.enabled));
  if (!secs.length) return '<p style="color:#888;padding:20px">還沒有題目可以輸出。請先到「1 出題」貼上題目，或載入範例。</p>';
  const total = secs.reduce((a, s) => a + countPoints(s), 0);
  const title = m.title || m.grammar || '練習單';
  const sub = m.subtitle || `Ejercicios de gramática china${levelEs() ? ' · ' + levelEs() : ''}`;
  let h = '';
  if (o.print !== 'key') {
    h += `<div class="s-top"><h1>${esc(title)}</h1><div class="s-sub">${esc(sub)}</div></div>
      <div class="s-who"><span>姓名 Nombre:</span><span>日期 Fecha:</span><span>分數 Puntos:　　 / ${total}</span></div>`;
    const g = state.grammarBox;
    if (g.points.some(p => p.pattern)) {
      h += `<div class="s-box"><h3>Recuerda · 先看一下</h3><table>${g.points.filter(p => p.pattern).map(p => `<tr><td class="p">${esc(p.pattern)}</td><td>${esc(p.es)}</td><td class="x">${esc(p.example)}</td></tr>`).join('')}</table>${g.warning ? `<div class="s-warn">${esc(g.warning)}</div>` : ''}</div>`;
    }
    secs.forEach((s, i) => { h += sectionStudent(s, i); });
  }
  if (o.print !== 'student') {
    h += `<div class="s-answer${o.print === 'both' ? ' pg' : ''}"><div class="s-top"><h1 style="font-size:19pt">答案 · Respuestas</h1><div class="s-sub">${esc(title)}${(o.pinyin || o.zhuyin) ? '　·　拼音、注音為電腦自動產生，使用前請老師再確認' : ''}</div></div>`;
    secs.forEach((s, i) => { h += sectionKey(s, i); });
    if (isMulti()) { const st = pointStats(); h += `<div class="s-stat">語法點分布（不含段落填空）：${st.names.map(n => `${esc(n)} ${st.per[n]} 題`).join('、')}；混合題 ${st.mixed} 題 / 共 ${st.total} 題。</div>`; }
    if (o.teacherNote) h += `<div class="s-teacher">全部 ${total} 分，每題 1 分。西翻中、排序的答案不只一種時，語序正確、使用指定句型即可給分。</div>`;
    h += '</div>';
  }
  return h;
}

/* ---- 句子庫匯出 ---- */
function allSentences() {
  const out = []; const m = state.meta;
  let curPts = '';
  const push = (type, trad, es) => {
    if (!str(trad)) return;
    out.push({ points: curPts, grammar: m.grammar || m.title, level: m.level, type, trad, simp: toSimp(trad), pinyin: pyLine(trad), zhuyin: zyLine(trad), es: es || '' });
  };
  for (const sec of state.sections) {
    if (!sec.enabled) continue;
    for (const it of sec.items) {
      if (!it.enabled) continue;
      curPts = (it.points || []).join('＋');
      if (sec.type === 'cloze') { answerSentence('cloze', it).split(/(?<=[。！？])/).forEach(s => push('cloze', s.trim(), '')); }
      else push(sec.type, answerSentence(sec.type, it), it.es || '');
    }
  }
  out.forEach((r, i) => r.id = i + 1);
  return out;
}
function toCSV(rows) {
  const cols = ['id', 'grammar', 'level', 'type', 'trad', 'simp', 'pinyin', 'zhuyin', 'es', 'points'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  return '﻿' + [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');
}

/* =====================================================================
   我的練習單（專案清單）：存在瀏覽器，登入 Google 後可同步到 Firebase
   雲端路徑：users/{uid}/worksheetProjects/{id}（規則要允許本人讀寫，見 README）
   ===================================================================== */
const PJ = { list: 'gwm.projects.v1', synced: 'gwm.projects.synced.v1', flag: 'gwm.projects.cloud.v1', common: 'gwm.cloud.v1' }; // common：兩個頁面共用的「已登入過」記號
function lsSetOk(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let PL = lsGet(PJ.list, []); if (!Array.isArray(PL)) PL = [];
let pjSynced = new Set(lsGet(PJ.synced, []));
let currentPid = null;
const pjCloud = { user: null, started: false, state: 'off' };
const PJ_FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
const PJ_CONFIG = { apiKey: 'AIzaSyDB6zYAHvi0oTkObv-qDnP6nn0UUnscby0', authDomain: 'moneybook-50481.firebaseapp.com', projectId: 'moneybook-50481',
  storageBucket: 'moneybook-50481.firebasestorage.app', messagingSenderId: '549256761796', appId: '1:549256761796:web:254332f109e7b8ad871491' };
function pjFmt(ts) { const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function pjSaveSynced() { lsSetOk(PJ.synced, Array.from(pjSynced)); }
function pjCount(s) { return (s.sections || []).filter(x => x.enabled).reduce((n, x) => n + countPoints(x), 0); }
// 本機格式 ↔ 雲端格式（雲端把整份專案存成一段文字，避免 Firestore 對巢狀陣列的限制）
const toRemote = e => ({ id: e.id, ts: e.ts, upd: e.upd, name: e.name, grammar: e.grammar, count: e.count, data: JSON.stringify(e.state) });
const fromRemote = r => { let s = null; try { s = JSON.parse(r.data); } catch (e) {} return s ? { id: r.id, ts: r.ts, upd: r.upd, name: r.name, grammar: r.grammar, count: r.count, state: s } : null; };

function pjAdapterFirebase() {
  let M;
  async function load() {
    if (M) return M;
    const [app, auth, fs] = await Promise.all([import(PJ_FB + 'firebase-app.js'), import(PJ_FB + 'firebase-auth.js'), import(PJ_FB + 'firebase-firestore.js')]);
    const a = app.initializeApp(PJ_CONFIG, 'gwm');
    M = { auth, fs, au: auth.getAuth(a), db: fs.getFirestore(a) };
    return M;
  }
  const col = m => m.fs.collection(m.db, 'users', m.au.currentUser.uid, 'worksheetProjects');
  return {
    async init(cb) { const m = await load(); m.auth.onAuthStateChanged(m.au, u => cb(u ? { uid: u.uid, email: u.email } : null)); },
    async login() { const m = await load(); await m.auth.signInWithPopup(m.au, new m.auth.GoogleAuthProvider()); },
    async logout() { const m = await load(); await m.auth.signOut(m.au); },
    async list() { const m = await load(); const s = await m.fs.getDocs(col(m)); return s.docs.map(d => d.data()); },
    async put(r) { const m = await load(); await m.fs.setDoc(m.fs.doc(col(m), r.id), r); },
    async remove(id) { const m = await load(); await m.fs.deleteDoc(m.fs.doc(col(m), id)); }
  };
}
const pjAdapter = window.__pjAdapter || pjAdapterFirebase();

function pjErr(e) {
  const c = String((e && e.code) || '');
  if (c.includes('permission')) return '雲端沒有權限：請先到 Firebase 加上 worksheetProjects 的規則';
  if (c.includes('popup')) return '登入視窗被擋住了，請允許彈出視窗後再試一次';
  if (c.includes('cancelled') || c.includes('closed')) return '登入已取消';
  return '雲端連線失敗：' + ((e && e.message) || e);
}
function renderPjCloud() {
  $('#pjLogin').hidden = pjCloud.state !== 'off';
  $('#pjPull').hidden = $('#pjLogout').hidden = pjCloud.state !== 'in';
  $('#siteUser').textContent = pjCloud.state === 'in' ? (pjCloud.user.email || '') : '';
  $('#pjCloudMsg').textContent = pjCloud.state === 'in' ? `已登入 ${pjCloud.user.email || ''}。存入清單的練習單會同步到雲端。`
    : pjCloud.state === 'connecting' ? '連線中…'
    : '目前只存在這台裝置。登入 Google 後會同步到雲端（只有你自己看得到），不登入也可以照常使用。';
}
function renderPj() {
  const q = $('#pjFilter').value.trim().toLowerCase();
  const list = PL.filter(e => !q || (e.name + ' ' + e.grammar).toLowerCase().includes(q)).sort((a, b) => (b.upd || b.ts) - (a.upd || a.ts));
  $('#pjList').innerHTML = list.length ? list.map(e => `
    <div class="pjitem" data-id="${esc(e.id)}">
      <div><b>${esc(e.name)}</b><small>${esc(pjFmt(e.upd || e.ts))}　${e.count || 0} 分</small>${pjCloud.user && !pjSynced.has(e.id) ? '<span class="pjtag">僅本機</span>' : ''}${e.id === currentPid ? '<span class="pjtag">目前開啟</span>' : ''}</div>
      <div class="row" style="margin:0"><button class="tiny" data-a="open">開啟</button><button class="tiny" data-a="over">用目前這份覆蓋</button><button class="tiny" data-a="del">刪除</button></div>
    </div>`).join('') : `<p class="hint">${PL.length ? '沒有符合的練習單。' : '清單還是空的。'}</p>`;
  const pct = Math.round(JSON.stringify(PL).length * 2 / (5 * 1024 * 1024) * 100);
  $('#pjMeter').textContent = `共 ${PL.length} 份，約佔瀏覽器可用空間的 ${pct}%` + (pct >= 70 ? '（快滿了，建議登入同步或刪掉不用的）' : '');
}
async function pjPut(e) {
  if (!pjCloud.user) return;
  try { await pjAdapter.put(toRemote(e)); pjSynced.add(e.id); pjSaveSynced(); renderPj(); }
  catch (err) { toast(pjErr(err) + '（已先存在本機）'); }
}
async function pjDel(id) {
  if (!pjCloud.user || !pjSynced.has(id)) return;
  try { await pjAdapter.remove(id); pjSynced.delete(id); pjSaveSynced(); }
  catch (err) { toast(pjErr(err) + '（雲端沒有刪掉，下次更新時會再出現）'); }
}
async function pjPull() {
  if (!pjCloud.user) return;
  let remote;
  try { remote = (await pjAdapter.list()).map(r => fromRemote(r)).filter(Boolean); } catch (err) { toast(pjErr(err)); return; }
  const rmap = new Map(remote.map(r => [r.id, r]));
  const last = x => x.upd || x.ts || 0;
  remote.forEach(r => {
    const l = PL.find(x => x.id === r.id);
    if (!l) PL.push(r); else if (last(r) > last(l)) Object.assign(l, r);
    pjSynced.add(r.id);
  });
  const gone = PL.filter(l => pjSynced.has(l.id) && !rmap.has(l.id));
  if (gone.length) { PL = PL.filter(l => !gone.includes(l)); gone.forEach(g => pjSynced.delete(g.id)); if (gone.some(g => g.id === currentPid)) currentPid = null; }
  const newer = PL.filter(l => rmap.has(l.id) && last(l) > last(rmap.get(l.id)));
  const only = PL.filter(l => !rmap.has(l.id));
  let up = newer.slice();
  if (only.length && confirm('這台裝置有 ' + only.length + ' 份練習單還沒上傳到雲端，要上傳嗎？')) up = up.concat(only);
  let fail = 0;
  for (const e of up) { try { await pjAdapter.put(toRemote(e)); pjSynced.add(e.id); } catch (err) { fail++; if (fail === 1) toast(pjErr(err)); } }
  if (!lsSetOk(PJ.list, PL)) toast('瀏覽器空間不夠，部分雲端內容沒存到這台裝置');
  pjSaveSynced(); renderPj();
  if (!fail) toast('雲端已更新（共 ' + PL.length + ' 份）');
}
async function startPjCloud() {
  if (pjCloud.started) return;
  pjCloud.started = true; pjCloud.state = 'connecting'; renderPjCloud();
  try {
    await pjAdapter.init(async u => {
      pjCloud.user = u; pjCloud.state = u ? 'in' : 'off'; renderPjCloud(); renderPj();
      if (u) await pjPull();
    });
  } catch (err) { pjCloud.started = false; pjCloud.state = 'off'; renderPjCloud(); toast('無法載入雲端功能，請確認網路連線'); }
}

$('#pjFilter').addEventListener('input', renderPj);
$('#pjSave').addEventListener('click', () => {

$('#pjList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.a) return;

    if (state.sections.length && !saved && !confirm('目前這份還沒存進清單，打開別份會把它換掉。\n（頁面只會自動記住最後一份）\n\n確定要打開「' + item.name + '」嗎？')) return;
    loadState(JSON.parse(JSON.stringify(item.state))); currentPid = item.id; $('#projPanel').hidden = true; toast('已打開「' + item.name + '」');
  } else if (a === 'over') {
    if (!state.sections.length) { toast('目前還沒有題目'); return; }
    if (!confirm('用目前這份覆蓋「' + item.name + '」？原本的內容會被取代。')) return;
    const old = { state: item.state, upd: item.upd, grammar: item.grammar, count: item.count };
    item.state = JSON.parse(JSON.stringify(state)); item.upd = Date.now(); item.grammar = state.meta.grammar || ''; item.count = pjCount(state);
    if (!lsSetOk(PJ.list, PL)) { Object.assign(item, old); toast('瀏覽器空間不夠，沒有存成功'); return; }
    currentPid = item.id; renderPj(); toast('已覆蓋'); pjPut(item);
  } else if (a === 'del') {
    if (!confirm('刪除「' + item.name + '」？')) return;
    PL = PL.filter(x => x !== item); if (currentPid === id) currentPid = null;
    lsSetOk(PJ.list, PL); renderPj(); pjDel(id);
  }
});
$('#pjLogin').addEventListener('click', async () => {

(function init() {
  const saved = lsGet(LS.proj, null);
  if (saved && saved.sections) {
    const base = newState();
    state = Object.assign(base, saved);
    state.meta = Object.assign(base.meta, saved.meta || {}); fixMeta(state.meta); syncGrammar();
    state.counts = Object.assign(base.counts, saved.counts || {});
    state.opts = Object.assign(base.opts, saved.opts || {});
    state.grammarBox = Object.assign({ points: [], warning: '' }, saved.grammarBox || {});
    state.sections = (saved.sections || []).map(sec => Object.assign(blankSection(sec.type), sec, { items: (sec.items || []).map(it => Object.assign(blankItem(sec.type), it)) }));
  }
  /* 從「課堂口說練習設計」帶過來的語法點 */
  const hand = lsGet('gwm.handoff.v1', null);
  let handed = false;
  if (hand) {
    try { localStorage.removeItem('gwm.handoff.v1'); } catch (e) {}
    const hp = (Array.isArray(hand.points) ? hand.points : []).map(x => String(x || '').trim()).filter(Boolean).slice(0, 3);
    if (hp.length && (!state.sections.length || confirm('目前練習單裡已有題目。換掉語法點可能讓題目的語法標記對不上，建議先儲存專案。\n\n確定要換成「' + hp.join('、') + '」嗎？'))) {
      state.meta.points = hp.concat(['', '', '']).slice(0, 3);
      if (hand.theme) state.meta.theme = String(hand.theme).trim();
      fixMeta(state.meta); syncGrammar(); save(); handed = true;
    }
  }
  renderStep1();
  if (handed) { goStep(1); toast('已從口說練習帶入 ' + pointsList().length + ' 個語法點'); }
  else if (state.sections.length) goStep(2);
})();
  GrammarPicker.attach($('#ptInputs'), 'input[data-pt]');
